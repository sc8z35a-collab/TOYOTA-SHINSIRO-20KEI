name: Publish scenery guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scenery-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the published source
        uses: actions/checkout@v4
      - name: Read Pages configuration
        uses: actions/configure-pages@v5
      - name: Prepare the static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R dist _site/dist
          cp .nojekyll _site/.nojekyll
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
